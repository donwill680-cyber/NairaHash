version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nairhash-db
    restart: always
    environment:
      POSTGRES_DB: nairhash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: nairhash-api
    depends_on:
      - db
    environment:
      ENVIRONMENT: development
      SECRET_KEY: change-me-very-secret
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/nairhash
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
