from __future__ import annotations

import asyncio
from datetime import datetime

from sqlalchemy import select

from app.core.ledger import credit_demo_reward
from app.db import AsyncSessionLocal
from app.models import RewardRule, User


async def process_daily_rewards() -> None:
    async with AsyncSessionLocal() as session:
        result = await session.execute(select(RewardRule).where(RewardRule.rule_type == "daily_reward", RewardRule.active.is_(True)))
        rule = result.scalar_one_or_none()
        if not rule:
            return

        user_result = await session.execute(select(User).where(User.is_active.is_(True)))
        today = datetime.utcnow().date().isoformat()

        for user in user_result.scalars().all():
            source_ref = f"daily_reward:{user.id}:{today}"
            existing = await session.execute(
                select(RewardRule).where(True)  # placeholder to satisfy syntax, overwritten below
            )
            # duplicate check is handled in credit_demo_reward, so we simply call it
            ok, _ = await credit_demo_reward(
                db=session,
                user_id=user.id,
                amount_sats=rule.amount_sats,
                source_type="daily_reward",
                source_ref=source_ref,
                description="Scheduled daily reward",
            )
            if ok:
                continue

        await session.commit()


def run_reward_cycle() -> None:
    asyncio.run(process_daily_rewards())
